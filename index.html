<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Insta360 360° fotogalerij</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #111;
    color: #eee;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    padding: 10px;
}

/* Thumbnail styling */
.thumb img {
    width: 100%;
    border-radius: 8px;
    cursor: pointer;
}

/* Portrait: 1 kolom */
#portrait-table { display: table; width: 100%; }
#landscape-table { display: none; }

/* Landscape: 3 kolommen */
@media (orientation: landscape) {
    #portrait-table { display: none; }
    #landscape-table { display: table; width: 100%; }
}

td { padding: 10px; }
</style>
</head>
<body>

<h1>Insta360 360° fotogalerij</h1>

<!-- Portrait layout -->
<table id="portrait-table">
    <tr><td><div class="thumb"><img src="thumb1.png" onclick="open360(0)"></div></td></tr>
    <tr><td><div class="thumb"><img src="thumb2.png" onclick="open360(1)"></div></td></tr>
    <tr><td><div class="thumb"><img src="thumb3.png" onclick="open360(2)"></div></td></tr>
    <tr><td><div class="thumb"><img src="thumb4.png" onclick="open360(3)"></div></td></tr>
    <tr><td><div class="thumb"><img src="thumb5.png" onclick="open360(4)"></div></td></tr>
    <tr><td><div class="thumb"><img src="thumb6.png" onclick="open360(5)"></div></td></tr>
</table>

<!-- Landscape layout -->
<table id="landscape-table">
<tr>
    <td><div class="thumb"><img src="thumb1.png" onclick="open360(0)"></div></td>
    <td><div class="thumb"><img src="thumb2.png" onclick="open360(1)"></div></td>
    <td><div class="thumb"><img src="thumb3.png" onclick="open360(2)"></div></td>
</tr>
<tr>
    <td><div class="thumb"><img src="thumb4.png" onclick="open360(3)"></div></td>
    <td><div class="thumb"><img src="thumb5.png" onclick="open360(4)"></div></td>
    <td><div class="thumb"><img src="thumb6.png" onclick="open360(5)"></div></td>
</tr>
</table>

<script>
const links = [
    "LINK1",
    "LINK2",
    "LINK3",
    "LINK4",
    "LINK5",
    "LINK6"
];

function open360(index) {
    window.open(links[index], "_blank");
}
</script>

</body>
</html>
