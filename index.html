<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Insta360 galerij</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111;
            color: #eee;
        }

        h1 {
            text-align: center;
            padding: 10px 0;
            font-size: 1.2rem;
        }

        /* Tabelstructuur */
        table {
            border-collapse: collapse;
            margin: 0 auto;
        }

        td {
            padding: 5px;
        }

        .thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .thumb::before {
            content: "360° foto";
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: 0.9rem;
        }

        /* Portrait: 1 kolom, 6 rijen */
        #table-portrait {
            display: table;
            width: 100%;
        }

        #table-landscape {
            display: none;
        }

        /* Landscape: 3 kolommen, 2 rijen */
        @media (orientation: landscape) {
            #table-portrait {
                display: none;
            }
            #table-landscape {
                display: table;
                width: 100%;
            }
        }

        /* Fullscreen overlay */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        #overlay-inner {
            position: relative;
            width: 100vw;
            max-width: 100vw;
        }

        /* Portrait viewer: 9:16 */
        .portrait-viewer {
            height: calc(100vw * (16 / 9));
        }

        /* Landscape viewer: 19:6 */
        .landscape-viewer {
            height: calc(100vw * (6 / 19));
        }

        #overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
            background: #000;
        }

        #overlay-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<h1>Insta360 360° fotogalerij</h1>

<!-- Portrait: 1 kolom, 6 rijen -->
<table id="table-portrait">
    <tr>
        <td><div class="thumb" onclick="openViewer(0)"></div></td>
    </tr>
    <tr>
        <td><div class="thumb" onclick="openViewer(1)"></div></td>
    </tr>
    <tr>
        <td><div class="thumb" onclick="openViewer(2)"></div></td>
    </tr>
    <tr>
        <td><div class="thumb" onclick="openViewer(3)"></div></td>
    </tr>
    <tr>
        <td><div class="thumb" onclick="openViewer(4)"></div></td>
    </tr>
    <tr>
        <td><div class="thumb" onclick="openViewer(5)"></div></td>
    </tr>
</table>

<!-- Landscape: 3 kolommen, 2 rijen -->
<table id="table-landscape">
    <tr>
        <td><div class="thumb" onclick="openViewer(0)"></div></td>
        <td><div class="thumb" onclick="openViewer(1)"></div></td>
        <td><div class="thumb" onclick="openViewer(2)"></div></td>
    </tr>
    <tr>
        <td><div class="thumb" onclick="openViewer(3)"></div></td>
        <td><div class="thumb" onclick="openViewer(4)"></div></td>
        <td><div class="thumb" onclick="openViewer(5)"></div></td>
    </tr>
</table>

<!-- Fullscreen overlay -->
<div id="overlay">
    <div id="overlay-inner">
        <button id="overlay-close" onclick="closeViewer()">Sluiten</button>
        <iframe id="viewer-frame" src="" allowfullscreen></iframe>
    </div>
</div>

<script>

        "https://cloud-fra.insta360.com/share/fra/4i2g6D3r1v2m2g1I4471770112/player?fbclid=IwY2xjawT-w-twZG9mBWV4dG4DYWVtAjEwAGJyaWQRMVpkRFZFVHhwU2lHcG9rUXhzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEecQoPY5xxngZDYsWEHyzc8sudY4x7MmfcHhr6F9r875h1MnxwI_wBZgcvxFw_aem_CNwwspqq9Zk3iOYACJCQHQ&mediaId=426312194695626752&businessId=426312214534684672",

        "https://cloud-fra.insta360.com/share/fra/4L2e693Q1Z1O714E7050143744/player?fbclid=IwY2xjawT-xCRwZG9mBWV4dG4DYWVtAjEwAGJyaWQRMVpkRFZFVHhwU2lHcG9rUXhzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEe_sHVmK1rj_GI1wXXqr2Ip2BH2g_nQ_EgIS2jROPkKDk5TJLxZ7RCWL08ZwA_aem_NLQoXhmpNUPF3z5tYGCftA&mediaId=426311719237713920&businessId=426311747113058304"
    ];

    function isPortrait() {
        return window.matchMedia("(orientation: portrait)").matches;
    }

    function openViewer(index) {
        const overlay = document.getElementById("overlay");
        const inner = document.getElementById("overlay-inner");
        const frame = document.getElementById("viewer-frame");

        frame.src = links[index];

        // aspect ratio afhankelijk van orientatie
        if (isPortrait()) {
            inner.classList.remove("landscape-viewer");
            inner.classList.add("portrait-viewer");
        } else {
            inner.classList.remove("portrait-viewer");
            inner.classList.add("landscape-viewer");
        }

        overlay.style.display = "flex";
    }

    function closeViewer() {
        const overlay = document.getElementById("overlay");
        const frame = document.getElementById("viewer-frame");
        frame.src = "";
        overlay.style.display = "none";
    }

    // Bij rotatie live aanpassen
    window.addEventListener("orientationchange", () => {
        const overlay = document.getElementById("overlay");
        const inner = document.getElementById("overlay-inner");
        if (overlay.style.display === "flex") {
            if (isPortrait()) {
                inner.classList.remove("landscape-viewer");
                inner.classList.add("portrait-viewer");
            } else {
                inner.classList.remove("portrait-viewer");
                inner.classList.add("landscape-viewer");
            }
        }
    });
</script>

</body>
</html>
